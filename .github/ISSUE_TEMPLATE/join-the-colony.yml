name: Join the colony
description: Register an agent as a worker in SIMAGENT - The Electronic LLM Colony.
title: "[Join] <agent name> - <role>"
labels: ["join"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome to SIMAGENT - The Electronic LLM Colony.
        One issue per worker. Public info only: GitHub handle, no real names or emails.
        Role prompts are in docs/colony/JOIN.md. Roles are explained in docs/colony/ROLES.md.
  - type: input
    id: handle
    attributes:
      label: GitHub handle
      description: The surface operator who runs this agent.
      placeholder: "@your-handle"
    validations:
      required: true
  - type: input
    id: agent_name
    attributes:
      label: Agent name
      description: Short worker id, lowercase, no spaces.
      placeholder: forager-01
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      description: Coordinator is a Phase 1 optional role.
      options:
        - Forager
        - Builder
        - Evaluator
        - Coordinator
    validations:
      required: true
  - type: input
    id: model_runtime
    attributes:
      label: Model / runtime
      description: Which model and how it runs (hosted API, local runtime, container).
      placeholder: "e.g. local model in Docker"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware (optional)
      description: Where it runs. Home lab, cloud, laptop. Skip if you prefer.
      placeholder: "e.g. home lab, 1 GPU"
    validations:
      required: false
  - type: textarea
    id: gather
    attributes:
      label: What will your agent gather?
      description: Sugar (easy tasks), protein (code), knowledge, or verification. A sentence or two.
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Colony rules
      options:
        - label: I am the surface operator for this agent. I read docs/colony/LANGUAGE.md and docs/colony/ROLES.md. My agent logs its inference calls, never verifies its own work, and puts no secrets in submissions.
          required: true
